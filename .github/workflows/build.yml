name: Build

on:
  push:
    paths-ignore: ['**.md', '.github/workflows/probe.yml', '.github/workflows/gecko-api.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p core test --stacktrace

  android:
    name: Assemble, lint, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug -Ppane.abis=arm64-v8a,x86_64 --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -Ppane.abis=arm64-v8a,x86_64
      - name: Lint
        run: ./gradlew :app:lintDebug -Ppane.abis=arm64-v8a,x86_64
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: pane-debug
          path: app/build/outputs/apk/debug/*.apk
