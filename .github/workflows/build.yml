name: Build

on:
  push:
    paths-ignore: ['**.md', '.github/workflows/probe.yml', '.github/workflows/gecko-api.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p core test

  android:
    name: Assemble, lint, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug -Ppane.abis=arm64-v8a,x86_64 --continue 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -Ppane.abis=arm64-v8a,x86_64 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: Lint
        run: ./gradlew :app:lintDebug -Ppane.abis=arm64-v8a,x86_64 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: Error summary
        if: failure()
        run: |
          echo "==== ERROR SUMMARY ===="
          grep -E '^e: |error:' build.log | grep -vE '^w: ' | sed -E 's|file:///home/runner/work/search-pr/search-pr/||' | sort -u | head -150
          echo "==== WHAT WENT WRONG ===="
          grep -A12 'What went wrong' build.log | head -60
          if ls app/build/reports/lint-results-debug.txt >/dev/null 2>&1; then echo "==== LINT ERRORS ===="; grep -A3 ': Error:' app/build/reports/lint-results-debug.txt | sed -E 's|/home/runner/work/search-pr/search-pr/||' | head -120; fi
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: pane-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release build (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release (arm64)
        run: ./gradlew :app:assembleRelease -Ppane.abis=arm64-v8a 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Error summary
        if: failure()
        run: |
          echo "==== R8 / BUILD ERRORS ===="
          grep -E '^e: |ERROR:|Missing class|R8:|error:' build.log | sort -u | head -80
          grep -A12 'What went wrong' build.log | head -40
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pane-release-arm64
          path: app/build/outputs/apk/release/*.apk
